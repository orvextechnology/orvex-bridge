<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">
<title>Login | ORVEX BRIDGE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d20;color:#fff;font-family:Arial,sans-serif;padding:25px 15px}
.container{max-width:450px;margin:55px auto;background:#111a32;padding:28px;border-radius:16px}
h1{text-align:center;color:#d8b45a}
p{text-align:center;color:#aebbd3}
label{display:block;margin-top:18px}
input{width:100%;padding:14px;margin-top:7px;border-radius:8px;border:1px solid #34415e;background:#080d20;color:white}
button{width:100%;padding:14px;margin-top:24px;border:0;border-radius:8px;background:#d8b45a;color:#080d20;font-weight:bold;font-size:16px}
#message{text-align:center;margin-top:18px;line-height:1.5}
a{color:#d8b45a}
</style>
</head>
<body>
<div class="container">
<h1>ORVEX BRIDGE</h1>
<p>Welcome back. Sign in to your account.</p>

<form id="loginForm">
<label>Email Address</label>
<input id="email" type="email" required>

<label>Password</label>
<input id="password" type="password" required>

<button id="loginButton" type="submit">Login</button>
</form>

<div id="message"></div>

<p><a href="register.html">Create an account</a></p>
<p><a href="index.html">Back to Home</a></p>
</div>

<script type="module">
import { supabase } from "./supabase-config.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "";

    try {
        const { error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        message.textContent = "Login successful! Redirecting...";
        window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = error.message || "Login failed. Please try again.";
        button.disabled = false;
        button.textContent = "Login";
    }
});
</script>
</body>
</html>
